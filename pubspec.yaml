name: fl_caption
description: "Offline live captions, translation and subtitle files, on ONNX Runtime."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rust_lib_fl_caption:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  # Locked like StarCitizenToolBox: newer releases have too many bugs.
  fluent_ui: 4.16.1
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  # The boyan01 fork desktop_multi_window needs (as StarCitizenToolBox).
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4
  desktop_multi_window: ^0.3.1
  flutter_acrylic: ^1.1.4
  tray_manager: ^0.8.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  intl: ^0.20.3
  desktop_drop: ^0.8.0
  qr_flutter: ^4.1.0
  record: ^7.1.2
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.4.2
  flutter_foreground_task: ^11.0.3
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/models/
    - assets/icons/
  fonts:
    - family: SourceHanSansCN
      fonts:
        - asset: assets/SourceHanSansCN-Regular.otf
dev_dependencies:
  flutter_lints: ^6.0.0

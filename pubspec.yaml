name: fl_caption
description: "Offline live captions, translation and subtitle files, on ONNX Runtime."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rust_lib_fl_caption:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  window_manager: ^0.5.2
  flutter_acrylic: ^1.1.4
  tray_manager: ^0.8.0
  file_picker: ^11.0.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  intl: ^0.20.3
  desktop_drop: ^0.8.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/models/
  fonts:
    - family: SourceHanSansCN
      fonts:
        - asset: assets/SourceHanSansCN-Regular.otf
dev_dependencies:
  flutter_lints: ^6.0.0

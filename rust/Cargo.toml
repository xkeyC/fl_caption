[package]
name = "rust_lib_fl_caption"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
anyhow = "1.0"
serde_json = "1.0.145"
rand = "0.9.2"
rand_distr = "0.5.1"
cpal = "0.17.0"
byteorder = "1.5.0"
once_cell = "1.21.3"
uuid = { version = "1.19.0", features = ["v4"] }
native-dialog = "0.9.4"
rayon = "1.11.0"
ndarray = "0.16"
ort = { version = "2.0.0-rc.12", features = ["xnnpack", "download-binaries"] }
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.9", features = ["v0_3_44"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5.0"
core-foundation = "0.10"
core-media-rs = "0.3.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

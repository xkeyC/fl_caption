[package]
name = "rust_lib_fl_caption"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["cuda"]
# Registers the CUDA execution provider. ONNX Runtime is loaded at run time
# (ort `load-dynamic`), so this needs no CUDA toolkit to build: a CPU-only
# runtime package simply reports CUDA unavailable.
cuda = [
    "local-backend-ort/cuda",
    "local-adapter-sensevoice-asr/cuda",
    "local-adapter-fun-asr-nano/cuda",
    "local-adapter-qwen3-chat/cuda",
]

[dependencies]
flutter_rust_bridge = "=2.13.0"

# local-multimodal-infra as a library: the ASR, chat (Qwen3 / Hy-MT2) and VAD
# adapters on ONNX Runtime. Path dependencies while feat/library-api is
# unpublished; switch to `git = ..., rev = ...` once it is pushed.
local-core = { path = "../../local-multimodal-infra/crates/foundation/core" }
local-error = { path = "../../local-multimodal-infra/crates/foundation/error" }
local-backend-ort = { path = "../../local-multimodal-infra/crates/inference/backend-ort" }
local-adapter-sensevoice-asr = { path = "../../local-multimodal-infra/crates/adapters/asr/sensevoice" }
local-adapter-fun-asr-nano = { path = "../../local-multimodal-infra/crates/adapters/asr/fun-asr-nano" }
local-adapter-qwen3-chat = { path = "../../local-multimodal-infra/crates/adapters/chat/qwen3" }
local-adapter-silero-vad = { path = "../../local-multimodal-infra/crates/adapters/vad/silero" }
# Chinese word boundaries for subtitle line breaks.
local-jieba = { path = "../../local-multimodal-infra/crates/text/jieba" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
nvml-wrapper = "0.11"
once_cell = "1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9"
libc = "0.2"

[dev-dependencies]
hound = "3.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
debug = "line-tables-only"
